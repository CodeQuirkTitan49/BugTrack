{% extends "auth.html" %}
{% block title %}BugTrack · Register{% endblock %}
{% block content %}
<h1>Create account</h1>
<p class="muted">New accounts are created as Developers.</p>
<form method="POST" class="stack-form">
    <label>Username</label>
    <input name="username" minlength="3" required>
    <label>Password</label>
    <input type="password" name="password" minlength="6" required>
    <button class="primary full" type="submit">Create account</button>
</form>
<p class="form-foot">Already registered? <a href="{{ url_for('login') }}">Back to login</a></p>
{% endblock %}
