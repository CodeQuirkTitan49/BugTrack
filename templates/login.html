{% extends "auth.html" %}
{% block title %}BugTrack · Login{% endblock %}
{% block content %}
<h1>Welcome back</h1>
<p class="muted">Sign in to your project workspace.</p>
<form method="POST" class="stack-form">
    <label>Username</label>
    <input name="username" autocomplete="username" required>
    <label>Password</label>
    <input type="password" name="password" autocomplete="current-password" required>
    <button class="primary full" type="submit">Sign in</button>
</form>
<p class="form-foot">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
{% endblock %}
